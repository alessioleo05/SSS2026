<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - Esercitazione Docker</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00dbde; border: none; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Benvenuto in Docker</h2>
        <form action="#" method="POST">
            <label>Email:</label>
            <input type="email" placeholder="tu@email.com" required>
            <label>Password:</label>
            <input type="password" placeholder="********" required>
            <button type="submit">Accedi</button>
        </form>
    </div>
</body>
</html>
